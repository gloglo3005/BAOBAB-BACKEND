      type: object
      properties:
        codes:
          type: array
          items:
            type: string
            maxLength: 50
          description: Codes d'inventaire des exemplaires à ajouter (200 au plus).
        location:
          type: string
          nullable: true
        condition:
          allOf:
          - $ref: '#/components/schemas/ConditionEnum'
          default: GOOD
      required:
      - codes
    Copy:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        book:
          allOf:
          - $ref: '#/components/schemas/BookMini'
          readOnly: true
        inventory_code:
