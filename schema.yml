openapi: 3.0.3
info:
  title: API de la plateforme bibliothèques
  version: 1.0.0
  description: API utilisée par le logiciel de bureau (staff) et l'application mobile
    (lecteurs).
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Connexion par email et mot de passe.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Profil du compte connecté, ses structures de staff et ses fiches
        de lecteur.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/password/:
    post:
      operationId: auth_password_create
      description: Changement de mot de passe ; lève l'obligation de changement.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/ping/:
    get:
      operationId: ping_retrieve
      description: Route publique pour vérifier que l'API répond.
      tags:
      - ping
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
          description: ''
  /api/v1/reader/{member_id}/books/:
    get:
      operationId: reader_books_list
      description: 'Catalogue : recherche `q`, filtre `category`, `available=1`.'
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReaderBookListList'
          description: ''
  /api/v1/reader/{member_id}/books/{id}/:
    get:
      operationId: reader_books_retrieve
      description: 'Détail d''un livre : disponibilité par emplacement et mes prêts
        de ce livre.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: member_id
        schema:
          type: string
        required: true
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderBookDetail'
          description: ''
  /api/v1/reader/{member_id}/categories/:
    get:
      operationId: reader_categories_list
      description: Catégories actives de la bibliothèque (pour filtrer le catalogue).
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
        required: true
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReaderCategory'
          description: ''
  /api/v1/reader/{member_id}/loans/:
    get:
      operationId: reader_loans_list
      description: 'Mes prêts : `status=active` (défaut), `overdue` ou `history`.'
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReaderLoanList'
          description: ''
  /api/v1/reader/{member_id}/summary/:
    get:
      operationId: reader_summary_retrieve
      description: Mon statut dans cette bibliothèque, mes prêts en cours et en retard.
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
        required: true
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/reader/link/:
    post:
      operationId: reader_link_create
      description: Relie mon compte à ma fiche de membre grâce à un code remis au
        comptoir.
      tags:
      - reader
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkCodeInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkCodeInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LinkCodeInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderMembership'
          description: ''
  /api/v1/reader/memberships/:
    get:
      operationId: reader_memberships_list
      description: 'GET : mes adhésions. POST : demande à rejoindre une structure
        (en attente).'
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReaderMembership'
          description: ''
    post:
      operationId: reader_memberships_create
      description: 'GET : mes adhésions. POST : demande à rejoindre une structure
        (en attente).'
      tags:
      - reader
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderMembership'
          description: ''
  /api/v1/reader/organizations/:
    get:
      operationId: reader_organizations_list
      description: Structures où l'on peut s'inscrire (actives, avec le module bibliothèque).
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationPublicList'
          description: ''
  /api/v1/staff/{organization_id}/books/:
    get:
      operationId: staff_books_list
      description: 'GET : liste des livres (lecture). POST : crée un livre.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookListList'
          description: ''
    post:
      operationId: staff_books_create
      description: 'GET : liste des livres (lecture). POST : crée un livre.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
          description: ''
  /api/v1/staff/{organization_id}/books/{id}/:
    get:
      operationId: staff_books_retrieve
      description: 'GET : détail d''un livre (lecture). PATCH : modifie les champs
        envoyés.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
          description: ''
    patch:
      operationId: staff_books_partial_update
      description: 'GET : détail d''un livre (lecture). PATCH : modifie les champs
        envoyés.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBookWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBookWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBookWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
          description: ''
  /api/v1/staff/{organization_id}/books/{id}/archive/:
    post:
      operationId: staff_books_archive_create
      description: Archive un livre (refusé si un exemplaire est encore emprunté).
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
          description: ''
  /api/v1/staff/{organization_id}/books/{id}/copies/:
    post:
      operationId: staff_books_copies_create
      description: Ajoute un ou plusieurs exemplaires à un livre (tout ou rien).
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopiesCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CopiesCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CopiesCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Copy'
          description: ''
  /api/v1/staff/{organization_id}/books/{id}/restore/:
    post:
      operationId: staff_books_restore_create
      description: Remet un livre archivé dans le catalogue.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
          description: ''
  /api/v1/staff/{organization_id}/categories/:
    get:
      operationId: staff_categories_list
      description: 'GET : liste (filtres q, active). POST : crée une entrée.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: staff_categories_create
      description: 'GET : liste (filtres q, active). POST : crée une entrée.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReferenceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReferenceCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/staff/{organization_id}/categories/{id}/:
    get:
      operationId: staff_categories_retrieve
      description: 'GET : détail. PATCH : renomme (name) et/ou (dés)active (active).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: staff_categories_partial_update
      description: 'GET : détail. PATCH : renomme (name) et/ou (dés)active (active).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReferenceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReferenceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReferenceUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/staff/{organization_id}/copies/:
    get:
      operationId: staff_copies_list
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCopyList'
          description: ''
  /api/v1/staff/{organization_id}/copies/{id}/:
    get:
      operationId: staff_copies_retrieve
      description: 'GET : détail d''un exemplaire (lecture). PATCH : état, notes,
        date d''acquisition.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Copy'
          description: ''
    patch:
      operationId: staff_copies_partial_update
      description: 'GET : détail d''un exemplaire (lecture). PATCH : état, notes,
        date d''acquisition.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCopyUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCopyUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCopyUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Copy'
          description: ''
  /api/v1/staff/{organization_id}/copies/{id}/move/:
    post:
      operationId: staff_copies_move_create
      description: Change l'emplacement d'un exemplaire (location null pour le retirer).
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyMove'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CopyMove'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CopyMove'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Copy'
          description: ''
  /api/v1/staff/{organization_id}/copies/{id}/status/:
    post:
      operationId: staff_copies_status_create
      description: Change à la main le statut d'un exemplaire (hors prêt et retour).
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyStatus'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CopyStatus'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CopyStatus'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Copy'
          description: ''
  /api/v1/staff/{organization_id}/dashboard/:
    get:
      operationId: staff_dashboard_retrieve
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/staff/{organization_id}/loans/:
    get:
      operationId: staff_loans_list
      description: 'GET : liste des prêts (lecture). POST : enregistre un prêt.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLoanList'
          description: ''
    post:
      operationId: staff_loans_create
      description: 'GET : liste des prêts (lecture). POST : enregistre un prêt.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoanCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoanCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
          description: ''
  /api/v1/staff/{organization_id}/loans/{id}/:
    get:
      operationId: staff_loans_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
          description: ''
  /api/v1/staff/{organization_id}/loans/{id}/lost/:
    post:
      operationId: staff_loans_lost_create
