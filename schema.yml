components:
  schemas:
    BlankEnum:
      enum:
      - ''
    BookDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Titre
          maxLength: 255
        subtitle:
          type: string
          title: Sous-titre
          maxLength: 255
        isbn:
          type: string
          maxLength: 20
        publication_year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          title: Année de publication
        publisher:
          type: string
          title: Éditeur
          maxLength: 150
        language:
          type: string
          title: Langue
          maxLength: 50
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryMini'
          readOnly: true
        authors:
          type: array
          items:
            type: string
          readOnly: true
        active:
          type: boolean
          title: Actif
        copies_total:
          type: integer
          readOnly: true
        copies_available:
          type: integer
          readOnly: true
        description:
          type: string
        copies:
          type: array
          items:
            $ref: '#/components/schemas/CopyInline'
          readOnly: true
      required:
      - authors
      - category
      - copies
      - copies_available
      - copies_total
      - id
      - title
    BookList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Titre
          maxLength: 255
        subtitle:
          type: string
          title: Sous-titre
          maxLength: 255
        isbn:
          type: string
          maxLength: 20
        publication_year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          title: Année de publication
        publisher:
          type: string
          title: Éditeur
          maxLength: 150
        language:
          type: string
          title: Langue
          maxLength: 50
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryMini'
          readOnly: true
        authors:
          type: array
          items:
            type: string
          readOnly: true
        active:
          type: boolean
          title: Actif
        copies_total:
          type: integer
          readOnly: true
        copies_available:
          type: integer
          readOnly: true
      required:
      - authors
      - category
      - copies_available
      - copies_total
      - id
      - title
    BookMini:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Titre
          maxLength: 255
      required:
      - id
      - title
    BookWrite:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        subtitle:
          type: string
