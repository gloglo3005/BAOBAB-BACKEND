      description: |-
        * `AVAILABLE` - Disponible
        * `BORROWED` - Emprunté
        * `LOST` - Perdu
        * `DAMAGED` - Endommagé
        * `UNAVAILABLE` - Indisponible
    CopyStatusStatusEnum:
      enum:
