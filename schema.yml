openapi: 3.0.3
info:
  title: API de la plateforme multi-activités
  version: 1.0.0
  description: API utilisée par le logiciel de bureau (staff) et l'application mobile
    (lecteurs).
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Connexion par email et mot de passe.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Profil du compte connecté, ses structures de staff et ses fiches
        de lecteur.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/password/:
    post:
      operationId: auth_password_create
      description: Changement de mot de passe ; lève l'obligation de changement.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Création d'un compte lecteur par le lecteur lui-même.

        Mêmes règles que le formulaire /reader/inscription/ (RegisterForm) : aucun champ
        de rôle n'est lu, le compte n'est jamais staff ni administrateur. Renvoie les
        jetons, comme la connexion : le lecteur est connecté dès son inscription.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/ping/:
    get:
      operationId: ping_retrieve
      description: Route publique pour vérifier que l'API répond.
      tags:
      - ping
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
          description: ''
  /api/v1/reader/{member_id}/books/:
    get:
      operationId: reader_books_list
      description: 'Catalogue : recherche `q`, filtre `category`, `available=1`.'
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReaderBookListList'
          description: ''
  /api/v1/reader/{member_id}/books/{id}/:
    get:
      operationId: reader_books_retrieve
      description: 'Détail d''un livre : disponibilité par emplacement et mes prêts
        de ce livre.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: member_id
        schema:
          type: string
        required: true
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderBookDetail'
          description: ''
  /api/v1/reader/{member_id}/categories/:
    get:
      operationId: reader_categories_list
      description: Catégories actives de la bibliothèque (pour filtrer le catalogue).
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
        required: true
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReaderCategory'
          description: ''
  /api/v1/reader/{member_id}/loans/:
    get:
      operationId: reader_loans_list
      description: 'Mes prêts : `status=active` (défaut), `overdue` ou `history`.'
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReaderLoanList'
          description: ''
  /api/v1/reader/{member_id}/summary/:
    get:
      operationId: reader_summary_retrieve
      description: Mon statut dans cette bibliothèque, mes prêts en cours et en retard.
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
        required: true
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/reader/coworking/{organization_id}/:
    get:
      operationId: reader_coworking_retrieve
      description: Présentation de l'espace, règles de réservation et ma fiche client
        (null si absente).
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/reader/coworking/{organization_id}/customer/:
    get:
      operationId: reader_coworking_customer_retrieve
      description: 'GET : ma fiche client (404 si absente). POST : je la crée (active
        tout de suite).'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
    post:
      operationId: reader_coworking_customer_create
      description: 'GET : ma fiche client (404 si absente). POST : je la crée (active
        tout de suite).'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - reader
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderCustomerInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReaderCustomerInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReaderCustomerInput'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/reader/coworking/{organization_id}/payments/:
    get:
      operationId: reader_coworking_payments_list
      description: Mes paiements enregistrés par l'espace (lecture seule).
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReaderPaymentList'
          description: ''
  /api/v1/reader/coworking/{organization_id}/rates/:
    get:
      operationId: reader_coworking_rates_list
      description: Tarifs en vigueur aujourd'hui.
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rate'
          description: ''
  /api/v1/reader/coworking/{organization_id}/reservations/:
    get:
      operationId: reader_coworking_reservations_list
      description: 'GET : mes réservations (?status=CONFIRMED...). POST : je réserve
        une ressource.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReaderReservationList'
          description: ''
    post:
      operationId: reader_coworking_reservations_create
      description: 'GET : mes réservations (?status=CONFIRMED...). POST : je réserve
        une ressource.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - reader
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderReservationInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReaderReservationInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReaderReservationInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderReservation'
          description: ''
  /api/v1/reader/coworking/{organization_id}/reservations/{id}/:
    get:
      operationId: reader_coworking_reservations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderReservation'
          description: ''
  /api/v1/reader/coworking/{organization_id}/reservations/{id}/cancel/:
    post:
      operationId: reader_coworking_reservations_cancel_create
      description: J'annule ma réservation, avant le délai d'annulation, avec un motif.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - reader
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderCancelInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReaderCancelInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReaderCancelInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderReservation'
          description: ''
  /api/v1/reader/coworking/{organization_id}/resources/:
    get:
      operationId: reader_coworking_resources_list
      description: Ressources réservables (actives, dans une zone active). ?type=DESK|ROOM|OTHER
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReaderResource'
          description: ''
  /api/v1/reader/coworking/{organization_id}/resources/availability/:
    get:
      operationId: reader_coworking_resources_availability_list
      description: 'Ressources libres sur toute une période : ?start=...&end=...&type=DESK'
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date-time
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date-time
        required: true
      - in: query
        name: type
        schema:
          type: string
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReaderResource'
          description: ''
  /api/v1/reader/coworking/{organization_id}/sessions/:
    get:
      operationId: reader_coworking_sessions_list
      description: 'Mes passages (arrivées et sorties) : ?status=OPEN|CLOSED'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReaderSessionList'
          description: ''
  /api/v1/reader/link/:
    post:
      operationId: reader_link_create
      description: Relie mon compte à ma fiche de membre grâce à un code remis au
        comptoir.
      tags:
      - reader
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkCodeInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkCodeInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LinkCodeInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderMembership'
          description: ''
  /api/v1/reader/memberships/:
    get:
      operationId: reader_memberships_list
      description: 'GET : mes adhésions. POST : demande à rejoindre une structure
        (en attente).'
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReaderMembership'
          description: ''
    post:
      operationId: reader_memberships_create
      description: 'GET : mes adhésions. POST : demande à rejoindre une structure
        (en attente).'
      tags:
      - reader
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderMembership'
          description: ''
  /api/v1/reader/organizations/:
    get:
      operationId: reader_organizations_list
      description: |-
        Structures visibles par le lecteur : actives, avec au moins un module.

        ?q= cherche dans le nom et la ville. ?module=library|coworking ne garde
        que les structures qui ont ce module. Chaque structure indique ses modules
        et le statut du lecteur dedans (my_membership pour la bibliothèque,
        my_customer pour le coworking).
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - reader
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationPublicList'
          description: ''
  /api/v1/staff/{organization_id}/books/:
    get:
      operationId: staff_books_list
      description: 'GET : liste des livres (lecture). POST : crée un livre.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookListList'
          description: ''
    post:
      operationId: staff_books_create
      description: 'GET : liste des livres (lecture). POST : crée un livre.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
          description: ''
  /api/v1/staff/{organization_id}/books/{id}/:
    get:
      operationId: staff_books_retrieve
      description: 'GET : détail d''un livre (lecture). PATCH : modifie les champs
        envoyés.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
          description: ''
    patch:
      operationId: staff_books_partial_update
      description: 'GET : détail d''un livre (lecture). PATCH : modifie les champs
        envoyés.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBookWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBookWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBookWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
          description: ''
  /api/v1/staff/{organization_id}/books/{id}/archive/:
    post:
      operationId: staff_books_archive_create
      description: Archive un livre (refusé si un exemplaire est encore emprunté).
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
          description: ''
  /api/v1/staff/{organization_id}/books/{id}/copies/:
    post:
      operationId: staff_books_copies_create
      description: Ajoute un ou plusieurs exemplaires à un livre (tout ou rien).
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopiesCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CopiesCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CopiesCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Copy'
          description: ''
  /api/v1/staff/{organization_id}/books/{id}/restore/:
    post:
      operationId: staff_books_restore_create
      description: Remet un livre archivé dans le catalogue.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
