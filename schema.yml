        notes:
          type: string
      required:
      - book
      - id
      - inventory_code
      - location
    CopyInline:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        inventory_code:
          type: string
          title: Code d'inventaire
          maxLength: 50
        location:
          allOf:
          - $ref: '#/components/schemas/LocationMini'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CopyStatusEnum'
          title: Statut
        condition:
          allOf:
          - $ref: '#/components/schemas/ConditionEnum'
          title: État
        acquisition_date:
