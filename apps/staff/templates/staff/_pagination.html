{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a class="btn btn-small btn-secondary" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}">Page précédente</a>{% endif %}
  <span>Page {{ page.number }} sur {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-small btn-secondary" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}">Page suivante</a>{% endif %}
</nav>
{% endif %}
