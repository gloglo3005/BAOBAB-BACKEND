<div class="table-wrap">
<table class="table">
  <thead><tr><th>Date</th><th>Fichier</th><th>Par</th><th>Statut</th><th>Lignes</th><th>Erreurs</th></tr></thead>
  <tbody>
  {% for batch in batches %}
    <tr>
      <td class="nowrap">{{ batch.created_at|date:"d/m/Y H:i" }}</td>
      <td><a href="{% url 'imports:import_detail' batch.pk %}">{{ batch.file_name }}</a></td>
      <td>{{ batch.user.email|default:"-" }}</td>
      <td>{% include "imports/_status.html" %}</td>
      <td>{{ batch.row_count }}</td>
      <td>{{ batch.error_count }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
</div>
