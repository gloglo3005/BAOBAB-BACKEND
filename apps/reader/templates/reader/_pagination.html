{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a class="btn btn-secondary" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.previous_page_number }}">Précédent</a>{% else %}<span></span>{% endif %}
  <span>Page {{ page.number }} sur {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-secondary" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.next_page_number }}">Suivant</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
